name: Update Tournament Data

on:
  push:
    paths:
      - 'data/teams/**'
      - 'data/tournament.json'
      - 'data/generated/db.json'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main  # Ensures we are on the correct branch

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Prime Intel & Build Database
        run: |
          node scripts/fetch_prime.js
          node scripts/build.js

      # --- NEW STEP: SYNC WITH HUMAN CHANGES ---
      - name: Pull latest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: main
          commit_message: "[skip ci] 🤖 System Update: Bracket & Stats berechnet"
          file_pattern: "data/generated/db.json data/prime_stats.json"