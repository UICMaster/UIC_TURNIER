name: Update Tournament Data

on:
  push:
    paths:
      - 'data/teams/**'
      - 'data/tournament.json'
      - 'data/generated/db.json'
  # Allows manual triggers if you need to force a refresh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0 # Important for rebase stability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Workspace
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Grabs human changes (CSS/HTML) that happened while the bot was starting
          git pull --rebase origin main

      - name: Execute Engine
        # If you still want Prime League stats, keep fetch_prime.js here
        run: |
          node scripts/fetch_prime.js
          node scripts/build.js

      - name: Commit Generated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[skip ci] 🤖 System Update: Engine hat Bracket berechnet"
          file_pattern: "data/generated/db.json data/prime_stats.json"
          branch: main
