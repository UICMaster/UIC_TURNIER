name: Update Tournament Data

on:
  push:
    paths:
      - 'data/teams/**'
      - 'data/tournament.json'
      - 'data/generated/db.json'
  schedule:
    # Runs automatically every 4 hours to keep Prime Stats fresh
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Prime Intel & Build Database
        run: |
          node scripts/fetch_prime.js
          node scripts/build.js

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          # CRITICAL: [skip ci] prevents the infinite action loop!
          commit_message: "[skip ci] 🤖 System Update: Bracket & Stats berechnet"
          file_pattern: "data/generated/db.json data/prime_stats.json"