name: Update Tournament Data

on:
  push:
    paths:
      - 'data/teams/**'
      - 'data/tournament.json'
      - 'data/generated/db.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch & Build
        run: |
          node scripts/fetch_prime.js
          node scripts/build.js

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          # [skip ci] verhindert, dass der Bot sich selbst triggert
          commit_message: "[skip ci] 🤖 System Update: Intel & Bracket synchronisiert"
          # Wir speichern db.json UND die Prime-Stats
          file_pattern: "data/generated/db.json data/prime_stats.json"
