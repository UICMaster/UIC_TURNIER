name: Hourly Prime Stats Sync

on:
  schedule:
    # Läuft exakt einmal pro Stunde (Minute 0)
    - cron: '0 * * * *'
  # Erlaubt es dir, den Sync jederzeit manuell im "Actions" Tab zu starten
  workflow_dispatch:

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Prime Intel
        run: node scripts/fetch_prime.js

      - name: Commit & Push Prime Stats
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 System Update: Prime League Stats synchronisiert [skip ci]"
          file_pattern: "data/prime_stats.json" # Hier muss der Pfad stehen, in den fetch_prime.js schreibt
